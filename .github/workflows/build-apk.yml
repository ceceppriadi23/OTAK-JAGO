name: Build Otak Jago Mystery Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Mystery Quest project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q "OTAK_JAGO_MYSTERY_QUEST_V1_GITHUB_READY.zip" -d project

          echo "=== PROJECT STRUCTURE ==="
          find project -maxdepth 3 -type f | sort

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK YANG DIHASILKAN ==="
          find project -type f -name "*.apk" -print

      - name: Upload Mystery Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: OTAK-JAGO-MYSTERY-QUEST-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

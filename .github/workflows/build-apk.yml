name: Build OTak Jago Mystery Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Mystery Quest project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q "OTAK_JAGO_MYSTERY_QUEST_V1_GITHUB_READY.zip" -d project

          echo "=== Isi project ==="
          find project -maxdepth 3 -type f | head -100

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew tidak ditemukan di dalam ZIP."
            echo "=== Isi ZIP ==="
            find project -maxdepth 5 -type f
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper ditemukan:"
          echo "$GRADLEW"

          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK yang dihasilkan ==="
          find project -type f -name "*.apk" -print

      - name: Upload Mystery Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: OTAK-JAGO-MYSTERY-QUEST-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

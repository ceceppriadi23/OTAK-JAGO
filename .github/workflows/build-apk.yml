name: Build Otak Jago Mystery Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Mystery Quest project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q "OTAK_JAGO_MYSTERY_QUEST_V1_GITHUB_READY.zip" -d project

          echo "=== PROJECT STRUCTURE ==="
          find project -maxdepth 4 -type f | sort

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Find Gradle root
        run: |
          ROOT_DIR=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$ROOT_DIR" ]; then
            echo "ERROR: Gradle root tidak ditemukan."
            find project -type f | sort
            exit 1
          fi

          echo "Gradle root ditemukan: $ROOT_DIR"
          echo "ROOT_DIR=$ROOT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$ROOT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK YANG DIHASILKAN ==="
          find "$ROOT_DIR" -type f -name "*.apk" -print

      - name: Upload Mystery Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: OTAK-JAGO-MYSTERY-QUEST-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

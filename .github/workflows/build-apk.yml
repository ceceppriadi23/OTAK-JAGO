name: Build OTAK JAGO APK Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q otak_jago_cloud_build.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias otak-jago \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass otakjago123 \
            -keypass otakjago123 \
            -dname "CN=OTAK JAGO, OU=OTAK JAGO, O=OTAK JAGO, L=Indonesia, ST=Indonesia, C=ID"

      - name: Sign Release APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-key-alias otak-jago \
            --ks-pass pass:otakjago123 \
            --key-pass pass:otakjago123 \
            --out otak-jago-release.apk \
            project/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose otak-jago-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OTAK-JAGO-RELEASE
          path: otak-jago-release.apk
